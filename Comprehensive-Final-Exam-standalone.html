<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprehensive Final Exam · Chapters 1 and 2</title>
<style>
:root{
  --bg-0:#040713; --bg-1:#080d24; --bg-2:#0d1738;
  --ink:#eaf2ff; --muted:#8fa3c8;
  --blue:#3b82f6; --blue-2:#60a5fa; --cyan:#22d3ee; --violet:#8b5cf6; --violet-2:#a78bfa;
  --green:#34d399; --red:#f87171; --amber:#fbbf24; --orange:#fb923c;
  --line:rgba(255,255,255,.10); --card:rgba(255,255,255,.045);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 15% -10%, rgba(59,130,246,.18), transparent 60%),
    radial-gradient(900px 600px at 95% 0%, rgba(139,92,246,.14), transparent 60%),
    radial-gradient(900px 700px at 50% 120%, rgba(34,211,238,.10), transparent 60%),
    linear-gradient(180deg,var(--bg-0),var(--bg-1) 45%,var(--bg-2));
  background-attachment:fixed;
  color:var(--ink);
  font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:15.5px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.f-d{font-family:Sora,Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
.ar{direction:rtl;font-family:'Segoe UI',Tahoma,sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
.hide{display:none!important}

/* ---------- header / timer ---------- */
#hdr{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(2,5,14,.82);border-bottom:1px solid var(--line);
}
#hdr .in{max-width:1060px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px}
#hdr img{height:38px;width:auto;display:block}
.brand b{display:block;font-family:Sora,sans-serif;font-size:14.5px;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.spacer{flex:1}
.pill{
  display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted);
}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}
#timer{font-family:Sora,sans-serif;font-size:19px;font-weight:800;letter-spacing:.02em;color:var(--cyan)}
#timer.warn{color:var(--amber)}
#timer.crit{color:var(--red);animation:tick 1s steps(2) infinite}
@keyframes tick{50%{opacity:.45}}
#bar{height:3px;background:rgba(255,255,255,.06)}
#barf{height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width 1s linear}
#barf.warn{background:linear-gradient(90deg,var(--amber),var(--orange))}
#barf.crit{background:linear-gradient(90deg,var(--red),var(--orange))}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:16px 0;
}
.sec-h{display:flex;align-items:center;gap:12px;margin:34px 0 6px}
.sec-h .n{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  font-family:Sora,sans-serif;font-weight:800;font-size:15px;
  background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.35);color:var(--blue-2);
}
.sec-h h2{font-size:23px}
.sec-h p{font-size:13px;color:var(--muted);margin-top:1px}

/* ---------- question ---------- */
.q{scroll-margin-top:90px}
.q-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.q-no{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;
  font-family:Sora,sans-serif;font-weight:800;font-size:13.5px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)
}
.q .q-no.done{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:var(--green)}
.tag{
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid;
}
.t-easy{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.10)}
.t-medium{color:var(--blue-2);border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.10)}
.t-hard{color:var(--orange);border-color:rgba(251,146,60,.35);background:rgba(251,146,60,.10)}
.t-extreme{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}
.t-mark{color:var(--amber);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.t-plain{color:var(--muted);border-color:var(--line);background:rgba(255,255,255,.03)}
.q-text{font-size:16.5px;font-weight:600;line-height:1.6;margin:2px 0 14px}

.opt{
  display:flex;align-items:flex-start;gap:12px;padding:12px 15px;margin:8px 0;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);
  cursor:pointer;transition:.16s;font-size:15px;
}
.opt:hover{border-color:rgba(96,165,250,.45);background:rgba(59,130,246,.07)}
.opt .k{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)
}
.opt.sel{border-color:var(--blue-2);background:rgba(59,130,246,.15)}
.opt.sel .k{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{border-color:var(--green);background:rgba(52,211,153,.12)}
.opt.ok .k{background:var(--green);border-color:var(--green);color:#04231a}
.opt.bad{border-color:var(--red);background:rgba(248,113,113,.12)}
.opt.bad .k{background:var(--red);border-color:var(--red);color:#2b0606}

/* matching */
.legend{
  padding:11px 14px;border-radius:12px;background:rgba(34,211,238,.06);
  border:1px solid rgba(34,211,238,.22);margin-bottom:12px;font-size:13px;
}
.legend .lt{color:var(--cyan);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:13.5px;
}
.chip .k{
  width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;
  background:rgba(59,130,246,.2);border:1px solid rgba(96,165,250,.4);color:var(--blue-2)
}
.row{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);margin:9px 0}
.row .rl{font-size:12px;font-weight:800;color:var(--cyan);margin-bottom:3px}
.row .rt{font-size:14.5px;margin-bottom:10px}
.row .chips .chip{cursor:pointer;transition:.15s}
.row .chips .chip:hover{border-color:rgba(96,165,250,.5)}
.row .chip.sel{background:rgba(59,130,246,.2);border-color:var(--blue-2);color:#fff;font-weight:600}
.row .chip.sel .k{background:var(--blue);border-color:var(--blue);color:#fff}
.row.ok{border-color:rgba(52,211,153,.45)}
.row.bad{border-color:rgba(248,113,113,.45)}

/* essay */
textarea{
  width:100%;min-height:140px;resize:vertical;padding:14px 16px;border-radius:12px;
  border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);
  font-family:inherit;font-size:15px;line-height:1.65;
}
textarea:focus{outline:none;border-color:var(--blue-2);background:rgba(0,0,0,.4)}
textarea::placeholder{color:#4c5c7a}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
.meta .lo{color:var(--orange)}
.meta .hi{color:var(--green)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:12px 26px;border-radius:12px;cursor:pointer;
  font-family:Sora,sans-serif;font-weight:700;font-size:15px;border:1px solid transparent;transition:.16s;
  background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px -10px rgba(59,130,246,.7)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--blue-2);color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------- start screen ---------- */
#start{min-height:calc(100vh - 62px);display:grid;place-items:center;padding:40px 22px}
#start .box{max-width:720px;width:100%;text-align:center}
#start img.logo{height:110px;margin-bottom:18px}
#start h1{font-size:40px;line-height:1.15;margin-bottom:8px}
#start .sub{color:var(--muted);font-size:16px;margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}
.fact{padding:16px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.fact b{display:block;font-family:Sora,sans-serif;font-size:24px;line-height:1.1}
.fact span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.rules{text-align:left;font-size:14px;color:var(--muted);margin:0 0 22px;padding:18px 22px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.rules li{margin:7px 0;list-style:none;padding-left:22px;position:relative}
.rules li:before{content:"▸";position:absolute;left:4px;color:var(--cyan)}
input.nm{
  width:100%;max-width:340px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.28);color:var(--ink);font-family:inherit;font-size:15px;text-align:center;margin-bottom:16px;
}
input.nm:focus{outline:none;border-color:var(--blue-2)}

/* ---------- result ---------- */
.ring{width:190px;height:190px;margin:0 auto 6px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:Sora,sans-serif;font-size:44px;line-height:1}
.ring .val span{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.verdict{text-align:center;margin:10px 0 4px;font-family:Sora,sans-serif;font-size:30px}
.pass{color:var(--green)} .fail{color:var(--red)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.tot{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:center}
.tot b{display:block;font-family:Sora,sans-serif;font-size:22px}
.tot span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.model{
  margin-top:12px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.7;
  background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.22);
}
.model .mt{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.kw{display:inline-block;padding:2px 9px;margin:3px 4px 0 0;border-radius:999px;font-size:12px;border:1px solid}
.kw.hit{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.kw.miss{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}

#nav{position:sticky;bottom:0;z-index:40;background:rgba(2,5,14,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 0}
#nav .in{max-width:1060px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;transition:.15s}
.dot:hover{border-color:var(--blue-2);color:var(--ink)}
.dot.done{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.4);color:var(--green)}
footer{text-align:center;padding:26px 22px 40px;font-size:12.5px;color:var(--muted)}

@media(max-width:760px){
  body{font-size:15px}
  .facts{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr}
  #start h1{font-size:30px}
  .card{padding:18px 16px}
  .wrap{padding:0 14px}
  #hdr .in{padding:9px 14px;gap:10px}
  .brand span{display:none}
  #timer{font-size:17px}
}


/* cyber extras */

#hdr,.wrap,#nav,footer{position:relative; z-index:2}
#timer,.mono,#hdr .pill{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace}
.brand span{font-family:ui-monospace,Consolas,monospace}
.t-easy{color:var(--green);border-color:rgba(96,165,250,.35);background:rgba(0,229,138,.10)}
.t-medium{color:#22d3ee;border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.10)}
#barf{background:linear-gradient(90deg,var(--blue),var(--violet))}

</style>
</head>

window.EXAM = [{"id": "x01", "section": "obj", "marks": 3, "lesson": "1-1", "level": "easy", "type": "mcq", "q": "Which development most directly caused the explosive spread of mobile Internet use in the 2000s?", "options": [{"t": "Vacuum-tube computers"}, {"t": "Smartphones", "c": 1}, {"t": "Mechanical calculators"}, {"t": "Quantum computers"}], "expl": "Smartphones put the Internet in everyone's pocket during the 2000s."}, {"id": "x02", "section": "obj", "marks": 3, "lesson": "2-1", "level": "easy", "type": "mcq", "q": "Which protocol adds TLS encryption to HTTP?", "options": [{"t": "FTP"}, {"t": "DNS"}, {"t": "HTTPS", "c": 1}, {"t": "SMTP"}], "expl": "HTTPS is HTTP with TLS encryption added."}, {"id": "x31", "section": "obj", "marks": 3, "lesson": "2-1", "level": "easy", "type": "mcq", "q": "Which one is an example of the factor 'something you are'?", "options": [{"t": "A fingerprint", "c": 1}, {"t": "A password"}, {"t": "A security question"}, {"t": "A one-time code on a phone"}], "expl": "Biometrics such as a fingerprint or a face are 'something you are'."}, {"id": "x03", "section": "obj", "marks": 4, "lesson": "1-2", "level": "easy", "type": "mcq", "q": "Which order goes from the widest concept to the narrowest?", "options": [{"t": "Artificial intelligence, machine learning, deep learning, generative AI", "c": 1}, {"t": "Deep learning, machine learning, artificial intelligence, generative AI"}, {"t": "Machine learning, artificial intelligence, generative AI, deep learning"}, {"t": "Generative AI, deep learning, artificial intelligence, machine learning"}], "expl": "AI contains machine learning, which contains deep learning, and generative AI is built on deep learning."}, {"id": "x04", "section": "obj", "marks": 4, "lesson": "2-2", "level": "easy", "type": "mcq", "q": "Which of the following is NOT an appropriate use of a VPN?", "options": [{"t": "Connecting safely from home to an organisation's network"}, {"t": "Encrypting communication on public Wi-Fi"}, {"t": "Connecting two offices in different locations safely"}, {"t": "Automatically deleting files infected with viruses", "c": 1}], "expl": "Deleting infected files is endpoint antivirus work, not a VPN function."}, {"id": "x05", "section": "obj", "marks": 4, "lesson": "2-3", "level": "medium", "type": "mcq", "q": "Which option gives the six stages of incident response in the correct order?", "options": [{"t": "Detection, eradication, containment, recovery, preparation, prevention"}, {"t": "Containment, detection, eradication, preparation, recovery, prevention"}, {"t": "Preparation, containment, detection, recovery, eradication, prevention"}, {"t": "Preparation, detection, containment, eradication, recovery, prevention of recurrence", "c": 1}], "expl": "Prepare, detect, contain, eradicate, recover, then prevent recurrence."}, {"id": "x06", "section": "obj", "marks": 5, "lesson": "1-1", "level": "medium", "type": "mcq", "q": "What does Moore's Law describe, and why is it reaching a limit?", "options": [{"t": "Transistors on a chip roughly double every two years, limited by physical effects such as quantum tunneling", "c": 1}, {"t": "Internet speed doubles every year, limited by cable length"}, {"t": "Computer prices double every two years, limited by demand"}, {"t": "Storage doubles every year, limited by disk size"}], "expl": "Miniaturisation is approaching a physical limit where leakage and quantum tunneling make further shrinking impractical."}, {"id": "x07", "section": "obj", "marks": 5, "lesson": "2-1", "level": "medium", "type": "mcq", "q": "During an HTTPS connection, how does the browser send the common key safely to the server?", "options": [{"t": "It sends it in plain text because the network is trusted"}, {"t": "It encrypts it with the server's public key, and the server decrypts it with its private key", "c": 1}, {"t": "It encrypts it with its own private key"}, {"t": "The certificate authority delivers the key for both sides"}], "expl": "A public key locks and only the matching private key unlocks, so only the real server obtains the common key."}, {"id": "x08", "section": "obj", "marks": 5, "lesson": "1-3", "level": "medium", "type": "mcq", "q": "An autonomous vehicle must react to an obstacle in milliseconds. Sending every camera frame to a distant cloud first is", "options": [{"t": "fine, because cloud servers are more powerful"}, {"t": "fine, because network delay never matters for video"}, {"t": "unsuitable, because the round trip adds delay; edge computing processes urgent data on the device", "c": 1}, {"t": "unsuitable, because clouds cannot store video"}], "expl": "Safety-critical decisions need edge computing; the cloud adds latency."}, {"id": "x09", "section": "obj", "marks": 5, "lesson": "2-2", "level": "medium", "type": "mcq", "q": "What is the most appropriate reason for placing a web server in a DMZ?", "options": [{"t": "To make the website load faster"}, {"t": "To expose every server to the Internet"}, {"t": "To detect and remove viruses automatically"}, {"t": "To prevent damage to the internal network if the public server is attacked", "c": 1}], "expl": "The DMZ separates exposed servers so a compromise cannot reach internal systems."}, {"id": "x33", "section": "obj", "marks": 5, "lesson": "2-1", "level": "medium", "type": "mcq", "q": "What does a digital certificate issued by a certificate authority mainly prove?", "options": [{"t": "That the website belongs to the organisation it claims to be, and that its public key is genuine", "c": 1}, {"t": "That the website has no software weaknesses"}, {"t": "That the user's password is strong enough"}, {"t": "That the data was never copied by anyone"}], "expl": "The CA binds an identity to a public key, which is what stops a convincing fake site."}, {"id": "x34", "section": "obj", "marks": 5, "lesson": "2-3", "level": "medium", "type": "mcq", "q": "A company lists two risks: a data leak with large impact and medium likelihood, and a short printer failure with small impact and high likelihood. Which should be handled first and why?", "options": [{"t": "The printer failure, because it is more likely"}, {"t": "The data leak, because risk size is impact multiplied by likelihood and its product is far larger", "c": 1}, {"t": "Both at the same time, because likelihood is all that matters"}, {"t": "Neither, because only certain events count as risks"}], "expl": "Risk size = impact × likelihood, so a large impact with medium likelihood outranks a tiny impact."}, {"id": "x10", "section": "obj", "marks": 5, "lesson": "1-1", "level": "hard", "type": "match", "q": "Match each period with what it introduced:", "rows": [{"id": "a", "t": "1940s to 1960s"}, {"id": "b", "t": "1970s to 1980s"}, {"id": "c", "t": "1990s"}, {"id": "d", "t": "2010s onward"}], "choices": [{"id": "A", "t": "Spread of personal computers"}, {"id": "B", "t": "Birth of the computer, used for military and scientific computation"}, {"id": "C", "t": "Spread of cloud computing and large-scale data analysis"}, {"id": "D", "t": "Commercialization of the Internet and the Web"}], "answer": {"a": "B", "b": "A", "c": "D", "d": "C"}, "expl": "Computers, then PCs, then the Internet, then the cloud."}, {"id": "x11", "section": "obj", "marks": 5, "lesson": "2-1", "level": "hard", "type": "match", "q": "Match each threat with the technology that addresses it:", "rows": [{"id": "a", "t": "Someone intercepts the traffic and reads it"}, {"id": "b", "t": "Data is altered on the way, and the sender later denies sending it"}, {"id": "c", "t": "A user is led to a fake copy of a website"}, {"id": "d", "t": "A leaked password is used to log in"}], "choices": [{"id": "A", "t": "Digital certificate"}, {"id": "B", "t": "Encryption"}, {"id": "C", "t": "Multi-factor authentication"}, {"id": "D", "t": "Digital signature"}], "answer": {"a": "B", "b": "D", "c": "A", "d": "C"}, "expl": "Encryption stops reading, signatures detect tampering and give non-repudiation, certificates prove identity, MFA blocks stolen-password logins."}, {"id": "x12", "section": "obj", "marks": 6, "lesson": "1-4", "level": "hard", "type": "match", "q": "Match each situation with the ethical principle it involves:", "rows": [{"id": "a", "t": "A hiring model scores one group lower despite similar qualifications"}, {"id": "b", "t": "A rejected applicant cannot find out why"}, {"id": "c", "t": "Records are kept far longer than the stated purpose needs"}, {"id": "d", "t": "Nobody can say who is answerable for a wrong automated decision"}], "choices": [{"id": "A", "t": "Privacy protection"}, {"id": "B", "t": "Accountability"}, {"id": "C", "t": "Fairness"}, {"id": "D", "t": "Transparency"}], "answer": {"a": "C", "b": "D", "c": "A", "d": "B"}, "expl": "Fairness, transparency, privacy protection and accountability are the four principles."}, {"id": "x13", "section": "obj", "marks": 6, "lesson": "2-2", "level": "hard", "type": "match", "q": "Match each measure with its layer of defense in depth:", "rows": [{"id": "a", "t": "Blocking unwanted traffic with a firewall"}, {"id": "b", "t": "Encrypting the connection with a VPN"}, {"id": "c", "t": "Separating public servers with a DMZ"}, {"id": "d", "t": "Antivirus and operating-system updates"}], "choices": [{"id": "A", "t": "Layer 4, endpoints"}, {"id": "B", "t": "Layer 1, network entry"}, {"id": "C", "t": "Layer 3, server placement"}, {"id": "D", "t": "Layer 2, communication path"}], "answer": {"a": "B", "b": "D", "c": "C", "d": "A"}, "expl": "Entry, path, placement, endpoints."}, {"id": "x35", "section": "obj", "marks": 6, "lesson": "comp", "level": "hard", "type": "match", "q": "Match each term with its correct description:", "rows": [{"id": "a", "t": "Cloud computing"}, {"id": "b", "t": "Edge computing"}, {"id": "c", "t": "Common-key cryptography"}, {"id": "d", "t": "Public-key cryptography"}], "choices": [{"id": "A", "t": "Processing on or near the device that produced the data, for urgent decisions"}, {"id": "B", "t": "One key locks and a different paired key unlocks, used to share a secret safely"}, {"id": "C", "t": "Processing and storage on remote servers, for large-scale work"}, {"id": "D", "t": "The same key encrypts and decrypts, and it is fast"}], "answer": {"a": "C", "b": "A", "c": "D", "d": "B"}, "expl": "Cloud is remote and large, edge is local and fast, common-key is one shared fast key, public-key is a key pair."}, {"id": "x14", "section": "obj", "marks": 7, "lesson": "1-2", "level": "extreme", "type": "mcq", "q": "A generative AI produces a fluent paragraph containing an invented statistic and a source that does not exist. What does this show?", "options": [{"t": "A hardware fault that a faster processor would fix"}, {"t": "An encryption failure during training"}, {"t": "Hallucination: fluent output is not proof of accuracy, so facts must be verified", "c": 1}, {"t": "Proof that generative AI can never be used for written work"}], "expl": "Generative models predict plausible text, so they can be confidently wrong."}, {"id": "x15", "section": "obj", "marks": 7, "lesson": "comp", "level": "extreme", "type": "mcq", "q": "A company has HTTPS, a firewall, a VPN and antivirus, but its public web server shares a network segment with the customer database and staff use passwords only. An attacker phishes one password and exploits the website. What is the most accurate assessment?", "options": [{"t": "The company is safe because four measures are already in place"}, {"t": "Two layers are missing: multi-factor authentication for logins and a DMZ for server placement, so one stolen password and one exploited server reach the internal data", "c": 1}, {"t": "The firewall will detect and remove the attack automatically"}, {"t": "HTTPS encryption prevents any stolen password from being used"}], "expl": "Encryption protects data in transit only; the identity layer and the placement layer were both absent."}, {"id": "x36", "section": "obj", "marks": 7, "lesson": "comp", "level": "extreme", "type": "mcq", "q": "A bank uses an AI model that approves loans, stores the records in the cloud, and lets analysts connect from home over a VPN. One analyst's password leaks. Which statement is most accurate?", "options": [{"t": "The VPN encrypts the connection, so a leaked password causes no harm"}, {"t": "The AI model will notice the intruder because it learns from data"}, {"t": "Encryption protects the data in transit, but it does not verify identity, so multi-factor authentication and zero trust checks are what stop the stolen password from being used", "c": 1}, {"t": "Moving the records out of the cloud would solve the problem completely"}], "expl": "A VPN protects the path, not the identity; the missing layer is authentication."}, {"id": "x16", "section": "ess", "marks": 4, "lesson": "1-1", "level": "medium", "type": "theory", "q": "In your own words, what is cashless payment? Give one example of where it is used.", "answer": "Cashless payment is a way of paying for goods or services without using physical cash, by using electronic money, a card, a QR code or a payment application on a phone, so the money moves electronically from the buyer's account to the seller. An example is paying for breakfast or for a bus ticket by scanning a QR code with a phone application, or paying for an online order by card instead of cash on delivery.", "keys": [["without cash", "no cash", "instead of cash", "electronic money"], ["card", "qr", "phone", "app", "application", "online"], ["example", "pay", "shop", "ticket", "order"]]}, {"id": "x17", "section": "ess", "marks": 4, "lesson": "2-1", "level": "medium", "type": "theory", "q": "What is a firewall, and what does it do? Write two or three simple sentences.", "answer": "A firewall is a system placed at the entry and exit point of a network. It checks the communication that tries to pass and allows or denies it according to rules that were set in advance. For example, it can allow visitors to reach the web server while denying any direct connection from the Internet to the database server, so unwanted traffic never gets in.", "keys": [["entry", "boundary", "edge", "between the network"], ["allow", "deny", "block", "permit"], ["rules", "set in advance", "preset", "policy"]]}, {"id": "x18", "section": "ess", "marks": 4, "lesson": "2-3", "level": "medium", "type": "theory", "q": "What is a security incident? Give two examples.", "answer": "A security incident is a situation in which actual damage happens because of an information security problem, so something has really gone wrong and not just a possible risk. Two examples are an information leak, where personal or confidential data is exposed to the outside, and a service outage, where a website or system becomes unavailable because of an attack on the server. Data tampering, where data inside a system is changed without permission, is a third example.", "keys": [["actual damage", "real damage", "damage occurs", "damage happens"], ["leak", "leaked", "information leak"], ["outage", "unavailable", "tampering", "altered", "ransomware", "encrypted"]]}, {"id": "x22", "section": "ess", "marks": 4, "lesson": "1-3", "level": "medium", "type": "theory", "q": "Choose one industry and explain how AI is used in it and what benefit it brings.", "answer": "In healthcare, AI analyses medical images such as CT scans and highlights areas that may show disease, which supports earlier and more consistent diagnosis and helps staff decide which patients to see first, while the doctor still makes the final decision. Other acceptable answers are agriculture, where image analysis detects crop pests so treatment is targeted and fewer chemicals are used; manufacturing, where AI inspects products and finds defects that a tired human eye may miss, raising quality and reducing waste; and logistics, where AI plans delivery routes and cuts travel time, fuel and cost.", "keys": [["healthcare", "medical", "agricultur", "manufactur", "logistic"], ["ct", "image", "pest", "defect", "route", "inspect", "diagnos"], ["benefit", "earlier", "faster", "quality", "reduce", "cost", "accurate", "consistent"]]}, {"id": "x37", "section": "ess", "marks": 4, "lesson": "1-1", "level": "medium", "type": "theory", "q": "What is cloud computing? Say one good thing about it in simple words.", "answer": "Cloud computing means that the processing and the storage happen on strong servers owned by a provider and reached over the Internet, instead of on your own computer or on servers inside your building. A good thing about it is that you can use as much power or space as you need and pay only for what you use, so a small school or company can run large services without buying and maintaining expensive machines, and the files can be reached from any place with an Internet connection.", "keys": [["remote", "internet", "servers", "provider", "not on your own"], ["storage", "processing", "compute"], ["benefit", "pay", "cheap", "scale", "as much", "anywhere", "no hardware", "maintain"]]}, {"id": "x19", "section": "ess", "marks": 5, "lesson": "1-2", "level": "medium", "type": "theory", "q": "What is the difference between a system that follows written rules and a system that learns from data? Give one example of each.", "answer": "A rule-based system follows conditions that a person wrote in advance, so it only handles the cases those rules describe and it must be edited by hand when something new appears; an example is a form that rejects a password shorter than eight characters. A system that learns from data studies many examples, finds patterns in them, and can then handle new cases it has never seen; an example is a model trained on thousands of photographs that recognises a cat in a picture it was never shown before. The first is predictable and easy to explain, while the second is more flexible but depends completely on the quality of the data it learned from.", "keys": [["rule", "written in advance", "conditions", "programmer"], ["learn", "pattern", "data", "examples"], ["new case", "unseen", "generalis", "flexible"], ["example"]]}, {"id": "x20", "section": "ess", "marks": 5, "lesson": "2-1", "level": "medium", "type": "theory", "q": "What does multi-factor authentication mean? Give one good example and one example that is not really multi-factor.", "answer": "Multi-factor authentication means proving who you are using two or more factors of different kinds, chosen from something you know, something you have and something you are. A good example is a password together with a one-time code sent to a registered phone, because the password is knowledge and the phone is possession, so a thief who learns the password still cannot log in. An example that is not really multi-factor is a password together with a secret question, because both of them are knowledge, so one leak or one guess can defeat both steps.", "keys": [["two or more", "two factors", "different kinds", "different factors"], ["knowledge", "possession", "biometric"], ["good example", "password", "code", "phone", "fingerprint", "sms"], ["not", "same factor", "both knowledge", "secret question", "two passwords"]]}, {"id": "x21", "section": "ess", "marks": 5, "lesson": "2-2", "level": "medium", "type": "theory", "q": "Why is it safer to put a public website on a DMZ instead of inside the internal network? Explain simply.", "answer": "A public website has to accept connections from anyone on the Internet, so it is the part most likely to be attacked successfully. If that server sits inside the internal network, an attacker who takes control of it is already in the trusted area and can move on to the database and the staff computers. If the server sits in a DMZ, it is separated by firewall rules, so the attacker only gains the DMZ and cannot reach the internal data. The damage is contained in the public area, which is exactly why the DMZ exists.", "keys": [["public", "anyone", "internet", "exposed", "most likely"], ["inside", "internal network", "trusted"], ["dmz", "separate", "isolat"], ["contain", "cannot reach", "limited", "database"]]}, {"id": "x38", "section": "ess", "marks": 5, "lesson": "2-1", "level": "medium", "type": "theory", "q": "What is a digital signature, and what does it tell the person who receives the message? Keep it simple.", "answer": "A digital signature is a small piece of data that the sender creates with a private key that only the sender has, and the receiver checks it with the matching public key. It tells the receiver two things. First, that the message really came from that sender, because nobody else could have produced the signature. Second, that the message was not changed on the way, because any change makes the check fail. It also means the sender cannot later deny having sent it, which is called non-repudiation, and this is why signatures are used for contracts and official documents.", "keys": [["private key", "signer", "sender creates"], ["public key", "verify", "check"], ["came from", "identity", "authentic", "really the sender"], ["not changed", "tamper", "altered", "integrity"], ["deny", "non-repudiation"]]}, {"id": "x39", "section": "ess", "marks": 5, "lesson": "2-2", "level": "medium", "type": "theory", "q": "What does defense in depth mean? Give two layers as examples and say why one layer alone is not enough.", "answer": "Defense in depth means protecting a system with several different layers instead of relying on one wall, so that if an attacker gets past one of them the next one still stands. For example, a firewall at the entry of the network blocks unwanted traffic, and an encrypted VPN protects the communication path so that data cannot be read even if it is captured; other layers are separating public servers in a DMZ and keeping endpoints protected with antivirus and updates. One layer is not enough because every measure has a gap: a firewall cannot see inside encrypted traffic, encryption does not check who the user is, and a user can still be tricked into opening an infected file, so the layers cover each other's weaknesses.", "keys": [["several", "multiple", "layers", "more than one"], ["firewall", "vpn", "dmz", "antivirus", "update", "encrypt"], ["if one fails", "next", "still", "gets past"], ["gap", "not enough", "weakness", "cannot"]]}, {"id": "x23", "section": "ess", "marks": 5, "lesson": "2-3", "level": "hard", "type": "theory", "q": "Why must containment come before eradication? Use a computer infected by malware as your example.", "answer": "Containment means stopping the damage from spreading, and eradication means removing the cause, and removing the cause takes time because the team must find the malware, see which machines are affected and clean them. While that work is going on, an infected computer that is still connected keeps infecting other computers and encrypting shared files, so the problem keeps growing. By disconnecting the infected computer from the network first, the size of the problem is frozen, and the eradication that follows deals with a known and fixed set of machines instead of a growing one.", "keys": [["contain", "stop", "limit"], ["spread", "spreading", "other computers", "shared"], ["eradicat", "remove the cause", "clean", "takes time", "investigat"], ["disconnect", "isolate", "network"]]}, {"id": "x24", "section": "ess", "marks": 5, "lesson": "2-3", "level": "hard", "type": "theory", "q": "A school restores its files from backup on the same morning it is attacked, and two days later the files are encrypted again. What mistake did it make, and what should it have done?", "answer": "The school performed recovery before eradication, so it brought the systems back while the cause was still present. The malware, or the stolen account or the unpatched weakness that let the attacker in, was never removed, so the restored files were attacked again as soon as they were available. The school should have contained the incident first by disconnecting the affected machines, then eradicated the cause by removing the malware and closing the way in, then recovered from tested backups, and finally analysed the cause and added measures such as multi-factor authentication and regular patching so the same incident does not return.", "keys": [["recovery before eradication", "restored before", "before removing the cause", "did not remove"], ["cause", "malware", "vulnerability", "account still"], ["contain", "disconnect", "isolate"], ["eradicat", "remove", "patch", "then recover"], ["prevent", "recurrence", "mfa", "backup", "training"]]}, {"id": "x25", "section": "ess", "marks": 5, "lesson": "2-3", "level": "hard", "type": "theory", "q": "How does a team decide which risk to deal with first? Explain the idea and give a short example.", "answer": "The team measures the size of each risk, and the size of a risk is its impact multiplied by its likelihood, where impact is how much damage happens if it occurs and likelihood is how probable it is. Risks that are high in both are dealt with first, because no team can fix everything at the same time and the biggest danger should not wait. For example, another ransomware attack on a school that has already been attacked has large impact and high likelihood, roughly three times three, so it comes before a brief power cut that has small impact even if it is fairly likely, roughly one times three.", "keys": [["impact"], ["likelihood", "probability", "chance"], ["multipl", "times", "size of the risk", "impact x", "impact ×"], ["first", "priority", "both high"], ["example"]]}, {"id": "x26", "section": "ess", "marks": 5, "lesson": "1-4", "level": "hard", "type": "theory", "q": "Why can an AI system be unfair even when the program itself is written correctly? Say what should be done about it.", "answer": "A machine learning system takes its behaviour from the data it was trained on, so if the data records past decisions that were unfair, or if a group is barely represented in it, the system learns those weaknesses and repeats them even though the code contains no mistake. Removing the sensitive field is not enough on its own, because other values can act as substitutes for it. What should be done is to test the results separately for each group to see where the system performs worse, improve and balance the training data, correct or change the model where it is unfair, explain the reasons behind decisions so problems can be noticed, and keep a human review for decisions that affect people.", "keys": [["data", "training data"], ["past", "historical", "unfair", "bias", "underrepresent", "not represent"], ["test", "check", "compare", "across groups", "measure"], ["improve", "balance", "correct", "human", "explain", "review"]]}, {"id": "x40", "section": "ess", "marks": 5, "lesson": "1-3", "level": "hard", "type": "theory", "q": "Give two benefits and two worries about using AI in everyday services such as shopping or transport. Write simply.", "answer": "Two benefits are speed and personal fit: a recommendation system can search a huge catalogue in a moment and suggest what matches a person's history, and route planning can pick a faster road and save time, fuel and cost. Two worries are, first, privacy, because these services work by collecting a lot of personal data about what people buy, where they go and when, and this data can be kept too long, shared or leaked; and second, unfairness and over-dependence, because a model trained on past data can give worse results to a group that is poorly represented, and people may accept the suggestion without thinking even when it is wrong. Good practice is to tell users what data is collected, keep only what is needed, test the results across different groups, and keep a human review for decisions that matter.", "keys": [["benefit", "fast", "quick", "personal", "recommend", "save", "cost", "time"], ["privacy", "personal data", "collect", "leak"], ["unfair", "bias", "group", "wrong", "depend", "trust too much"], ["example"]]}, {"id": "x27", "section": "ess", "marks": 6, "lesson": "1-2", "level": "hard", "type": "theory", "q": "Explain the link between artificial intelligence, machine learning, deep learning and generative AI. Give one example for each of the last three.", "answer": "Artificial intelligence is the widest term and covers any system that performs tasks that would normally need human intelligence, including systems built from written rules. Machine learning is a part of AI in which the system finds patterns in data instead of being given rules, for example predicting which customers are likely to stop a subscription. Deep learning is a part of machine learning that uses neural networks with many layers, where each layer picks out more complex features, for example recognising objects in photographs or turning speech into text. Generative AI is built on deep learning and produces new content such as text, images or code, for example drafting a summary of a long article. Each one is contained inside the one before it, so all generative AI is deep learning, all deep learning is machine learning, and all of them are artificial intelligence.", "keys": [["artificial intelligence", "widest", "broadest"], ["machine learning", "patterns", "from data"], ["deep learning", "neural", "layers"], ["generative", "new content", "creates"], ["example"]]}, {"id": "x28", "section": "ess", "marks": 6, "lesson": "2-1", "level": "hard", "type": "theory", "q": "Why does HTTPS use two different kinds of cryptography instead of just one? Keep your answer simple and mention speed.", "answer": "Public-key cryptography solves the problem of agreeing on a secret over an open network, because the browser can lock the common key with the server's public key and only the server's private key can open it, so an eavesdropper who captures the message learns nothing. However, public-key cryptography is heavy and slow, so using it for every byte of a page would make browsing uncomfortable. Common-key cryptography uses the same key on both sides and is much faster, but on its own it cannot deliver that key safely across the Internet. HTTPS therefore uses each one for what it is good at: public-key cryptography once, to share the key safely, and common-key cryptography afterwards, to move the data quickly, which gives both security and speed.", "keys": [["public-key", "public key"], ["share", "exchange the key", "deliver the key", "safely"], ["common-key", "common key", "same key"], ["fast", "faster", "slow", "speed"], ["both", "security and speed", "division", "each"]]}, {"id": "x29", "section": "ess", "marks": 6, "lesson": "2-2", "level": "hard", "type": "theory", "q": "What does zero trust mean, and why was it needed? Explain in simple words.", "answer": "Zero trust means that no request is trusted just because of where it comes from, so every access is verified every time, including access that comes from inside the organisation's own network. In practice the system checks who is asking, usually with multi-factor authentication, checks the device, and checks whether that person is allowed to reach that particular resource. It was needed because the old design assumed that inside was safe and outside was dangerous, and that assumption stopped being true when organisations moved data to cloud services and staff began working from home, so there is no longer a clear line between inside and outside to defend.", "keys": [["not trust", "never trust", "no trust", "does not trust"], ["verify", "check", "every time", "identity"], ["inside", "internal"], ["cloud", "remote work", "boundary", "perimeter", "blurred", "no longer"]]}, {"id": "x30", "section": "ess", "marks": 6, "lesson": "comp", "level": "extreme", "type": "theory", "q": "A hospital uses an AI that reads CT scans, keeps patient records in the cloud, and lets doctors work from home. Using both chapters, write about: what kind of AI this is, two security measures the hospital needs, and who is responsible for a wrong diagnosis.", "answer": "The AI is a machine learning system, and more precisely deep learning, because reading medical images depends on a neural network of many layers that learns patterns from a large set of scans already labelled by specialists, so the quality and representativeness of that training data decide how well it works. For security, the hospital first needs strong authentication under zero trust, so every doctor signs in with multi-factor authentication, such as a password plus a code on a registered device, and permissions are checked on every access, since records now live in the cloud and staff connect from home and there is no safe inside any more. Second, it needs layered protection of the path and the devices, which means an encrypted connection using HTTPS or a VPN so records cannot be read on a home network, a firewall and a DMZ so that any public-facing server is separated from the record system, and managed endpoints with antivirus and up-to-date operating systems. It should also prepare an incident response plan in advance, because preparation is the first stage, and prioritise risks by impact multiplied by likelihood, where a leak of patient data scores high on both. Responsibility for a wrong diagnosis stays with the doctor and the hospital, because the system produces a suggestion with a probability and can be confidently wrong on an unusual case, so a named person must weigh it against the patient's history, be able to explain the decision and answer for it, which is the principle of accountability, while the developer remains answerable for technical faults in the system.", "keys": [["machine learning", "deep learning", "neural"], ["training data", "labelled", "learns from"], ["multi-factor", "mfa", "zero trust", "verify every"], ["vpn", "https", "encrypt", "firewall", "dmz", "antivirus", "endpoint"], ["doctor", "human", "hospital", "account", "responsib"], ["probability", "suggestion", "can be wrong", "not certain", "explain"]]}, {"id": "x41", "section": "ess", "marks": 6, "lesson": "comp", "level": "extreme", "type": "theory", "q": "A small company is attacked by ransomware: the files are encrypted and a payment is demanded. In simple words, write what the company should do step by step, and two things it should have done before the attack.", "answer": "The first step is preparation already in place, but once the attack is discovered the company should detect and confirm the scope, which means finding which computers and shared folders are affected. Then it should contain the damage by disconnecting the infected machines from the network so the malware stops spreading to other devices and backups. Then it should eradicate the cause by removing the malware, closing the weakness that let it in, and resetting any account that may have been stolen. Only after that should it recover, by restoring the files from a clean backup that was kept offline and checking that the systems work correctly, and paying the attacker is not a solution because there is no guarantee and it encourages more attacks. Finally it should prevent recurrence by studying how the attack happened and adding measures. Two things it should have done before the attack are keeping regular backups that are stored offline or separately and tested by trial restores, and protecting accounts with multi-factor authentication together with staff training on suspicious email and up-to-date systems.", "keys": [["detect", "confirm", "scope", "which machines"], ["contain", "disconnect", "isolate", "stop spreading"], ["eradicat", "remove", "malware", "patch", "reset"], ["recover", "restore", "backup"], ["prevent", "recurrence", "analyse", "report"], ["before", "backup", "offline", "tested", "mfa", "training", "update"]]}];

 /* ---------------- start screen ---------------- */
 function startScreen() {
  $('#app').innerHTML =
   '<div id="start"><div class="box">' +
   (CFG.logo ? '<img class="logo" src="' + CFG.logo + '" alt="logo">' : '') +
   '<h1>Comprehensive Final Exam: IT, AI and Cybersecurity</h1>' +

   '<p class="sub ar">امتحان شامل على الفصلين · نصه اختيار وتوصيل ونصه مقالي بلغة سهلة · متدرّج الصعوبة</p>' +
   '<div class="facts">' +
    '<div class="fact"><b>40</b><span>Questions</span></div>' +

   '</div>' +
   '<ul class="rules ar">' +
 '<li>الامتحان <b>٤٠ سؤال</b> على <b>الفصلين مع بعض</b>: القسم الأول ٢٠ سؤال اختيار وتوصيل (١٠٠ درجة)، والقسم الثاني ٢٠ سؤال مقالي (١٠٠ درجة). المجموع ٢٠٠ درجة.</li>' +
 '<li>الأسئلة المقالية مكتوبة <b>بلغة سهلة وبسيطة</b>، بس الإجابة لازم تكون وافية.</li>' +
 '<li>الأسئلة <b>متدرّجة الصعوبة</b>: بتبدأ Easy وبتنتهي Extreme، ومعظمها Hard و Extreme.</li>' +
 '<li>المدة <b>ساعة كاملة</b>، فنظّم وقتك: حوالي دقيقة للسؤال الموضوعي والباقي للمقالي. العداد بيبدأ أول ما تضغط ابدأ ومش بيقف، ولما يخلص الوقت الامتحان بيتسلّم أوتوماتيك.</li>' +
 '<li>درجة النجاح <b>٧٠٪</b>: أقل من كده = Failed.</li>' +
 '<li>الأسئلة المقالية بتتصحّح أوتوماتيك بالكلمات المفتاحية، وهتشوف الإجابة النموذجية بعد التسليم.</li>' +
 '<li>إجاباتك بتتحفظ في المتصفح، فلو الصفحة قفلت بالغلط هتكمّل من مكانك والوقت بيفضل ماشي.</li>' +
'</ul>' +
   '<input class="nm" id="nm" placeholder="اسمك / Your name" autocomplete="off">' +
   '<div><button class="btn" id="go">ابدأ الامتحان · Start Exam →</button></div>' +
   '</div></div>';

  $('#go').onclick = begin;
  $('#nm').onkeydown = function (e) { if (e.key === 'Enter') begin(); };
 }

 /* ---------------- exam body ---------------- */
 function begin() {
  var nm = ($('#nm') && $('#nm').value.trim()) || '';
  try { sessionStorage.setItem('comp_exam_name', nm); } catch (e) {}
  started = Date.now();
  left = DURATION;
  build();
  runTimer();
  window.scrollTo(0, 0);
 }

 function qHead(q, n) {
  return '<div class="q-top">' +
   '<div class="q-no" id="no' + q.id + '">' + n + '</div>' +
   '<span class="tag t-' + q.level + '">' + q.level + '</span>' +
   '<span class="tag t-plain">' + (q.type === 'match' ? 'Matching' : q.type === 'mcq' ? 'Multiple choice' : 'Essay') + '</span>' +
   '<span class="tag t-plain">Lesson ' + q.lesson + '</span>' +
   '<span class="spacer"></span>' +
   '<span class="tag t-mark">' + q.marks + ' marks</span>' +
   '</div>';
 }

 function qBody(q) {
  if (q.type === 'mcq') {
   return q.options.map(function (o, i) {
    return '<div class="opt" data-q="' + q.id + '" data-i="' + i + '">' +
     '<span class="k">' + LET[i] + '</span><span>' + esc(o.t) + '</span></div>';
   }).join('');
  }
  if (q.type === 'match') {
   var leg = '<div class="legend"><div class="lt">Choose from</div><div class="chips">' +
    q.choices.map(function (c) {
     return '<span class="chip"><span class="k">' + c.id + '</span>' + esc(c.t) + '</span>';
    }).join('') + '</div></div>';
   var rows = q.rows.map(function (r) {
    return '<div class="row" id="row-' + q.id + '-' + r.id + '">' +
     '<div class="rl">' + r.id + ')</div><div class="rt">' + esc(r.t) + '</div>' +
     '<div class="chips">' + q.choices.map(function (c) {
      return '<span class="chip" data-q="' + q.id + '" data-r="' + r.id + '" data-c="' + c.id + '">' +
       '<span class="k">' + c.id + '</span>' + esc(c.t) + '</span>';
     }).join('') + '</div></div>';
   }).join('');
   return leg + rows;
  }
  // essay
  return '<textarea data-q="' + q.id + '" placeholder="اكتب إجابتك هنا بالإنجليزي… حاول تغطّي كل العناصر المطلوبة في السؤال."></textarea>' +
   '<div class="meta"><span id="w' + q.id + '" class="lo">0 words</span>' +
   '<span>يُفضَّل ' + MIN_WORDS + '+ كلمة · ' + q.marks + ' marks</span></div>';
 }

 function build() {
  var n = 0, html = '';
  html += '<div class="sec-h"><div class="n">I</div><div><h2>Section I, Objective</h2>' +
   '<p>Multiple choice &amp; matching · ' + TOT_OBJ + ' marks · اختيار من متعدد وتوصيل</p></div></div>';
  OBJ.forEach(function (q) { n++; html += '<div class="card q" id="q' + q.id + '">' + qHead(q, n) + '<div class="q-text">' + esc(q.q) + '</div>' + qBody(q) + '</div>'; });

  html += '<div class="sec-h"><div class="n">II</div><div><h2>Section II, Essay</h2>' +
   '<p>Written analysis · ' + TOT_ESS + ' marks · أسئلة مقالية تحليلية</p></div></div>';
  ESS.forEach(function (q) { n++; html += '<div class="card q" id="q' + q.id + '">' + qHead(q, n) + '<div class="q-text">' + esc(q.q) + '</div>' + qBody(q) + '</div>'; });

  html += '<div class="card" style="text-align:center">' +
   '<p style="color:var(--muted);font-size:14px;margin-bottom:14px" class="ar">راجع إجاباتك كويس, بعد التسليم مش هتقدر تعدّل.</p>' +
   '<button class="btn" id="submit">تسليم الامتحان · Submit</button></div>';

  $('#app').innerHTML = '<div class="wrap">' + html + '</div>' +
   '<div id="nav"><div class="in"><div class="dots" id="dots"></div>' +
   '<span class="pill"><span id="cnt">0</span>/20 answered</span></div></div>';

  $('#dots').innerHTML = Q.map(function (q, i) {
   return '<span class="dot" id="d' + q.id + '" data-go="' + q.id + '">' + (i + 1) + '</span>';
  }).join('');

  $('#hdrbar').classList.remove('hide');
  wire();
 }

 function wire() {
  $('#app').addEventListener('click', function (e) {
   if (done) return;
   var o = e.target.closest('.opt');
   if (o) {
    var id = o.dataset.q;
    [].forEach.call(document.querySelectorAll('.opt[data-q="' + id + '"]'), function (x) { x.classList.remove('sel'); });
    o.classList.add('sel');
    ans[id] = +o.dataset.i;
    mark(id); return;
   }
   var c = e.target.closest('.row .chip');
   if (c) {
    var q = c.dataset.q, r = c.dataset.r;
    [].forEach.call(document.querySelectorAll('.chip[data-q="' + q + '"][data-r="' + r + '"]'), function (x) { x.classList.remove('sel'); });
    c.classList.add('sel');
    ans[q] = ans[q] || {};
    ans[q][r] = c.dataset.c;
    mark(q); return;
   }
   var d = e.target.closest('.dot');
   if (d) { var el = $('#q' + d.dataset.go); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
   if (e.target.id === 'submit') { if (confirm('تسليم الامتحان نهائياً؟')) finish('submitted'); }
  });

  $('#app').addEventListener('input', function (e) {
   if (done || e.target.tagName !== 'TEXTAREA') return;
   var id = e.target.dataset.q, w = words(e.target.value);
   ans[id] = e.target.value;
   var m = $('#w' + id);
   m.textContent = w + ' words';
   m.className = w >= MIN_WORDS ? 'hi' : 'lo';
   mark(id); save();
  });
 }

 function answered(q) {
  var v = ans[q.id];
  if (q.type === 'mcq') return typeof v === 'number';
  if (q.type === 'match') return v && Object.keys(v).length === q.rows.length;
  return words(v) >= 5;
 }

 function mark(id) {
  var q = Q.find(function (x) { return x.id === id; });
  var ok = answered(q);
  var no = $('#no' + id), dot = $('#d' + id);
  if (no) no.classList.toggle('done', ok);
  if (dot) dot.classList.toggle('done', ok);
  $('#cnt').textContent = Q.filter(answered).length;
  save();
 }

 function save() {
  try {
   localStorage.setItem('comp_exam_state', JSON.stringify({ ans: ans, left: left, t: Date.now() }));
  } catch (e) {}
 }

 /* ---------------- timer ---------------- */
 function fmt(s) {
  var m = Math.floor(s / 60), x = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
 }
 function runTimer() {
  clearInterval(tick);
  paint();
  tick = setInterval(function () {
   left--;
   paint();
   if (left % 5 === 0) save();
   if (left <= 0) { clearInterval(tick); finish('timeout'); }
  }, 1000);
 }
 function paint() {
  var t = $('#timer'), b = $('#barf');
  t.textContent = fmt(Math.max(0, left));
  var pct = (left / DURATION) * 100;
  b.style.width = Math.max(0, pct) + '%';
  var cls = left <= 60 ? 'crit' : left <= 300 ? 'warn' : '';
  t.className = cls; b.className = cls;
 }

 /* ---------------- grading ---------------- */
 function gradeObj(q) {
  var v = ans[q.id], got = 0, detail = '';
  if (q.type === 'mcq') {
   var ci = q.options.findIndex(function (o) { return o.c; });
   got = (v === ci) ? q.marks : 0;
   detail = 'Correct answer: <b>' + LET[ci] + '</b>' + esc(q.options[ci].t);
   [].forEach.call(document.querySelectorAll('.opt[data-q="' + q.id + '"]'), function (o, i) {
    o.classList.remove('sel');
    if (i === ci) o.classList.add('ok');
    else if (i === v) o.classList.add('bad');
   });
  } else {
   var rows = q.rows.length, hit = 0;
   q.rows.forEach(function (r) {
    var pick = v && v[r.id], good = q.answer[r.id];
    if (pick === good) hit++;
    var el = $('#row-' + q.id + '-' + r.id);
    if (el) el.classList.add(pick === good ? 'ok' : 'bad');
   });
   got = Math.round((hit / rows) * q.marks * 100) / 100;
   detail = 'Correct matching: ' + q.rows.map(function (r) {
    var ch = q.choices.find(function (c) { return c.id === q.answer[r.id]; });
    return '<b>' + r.id + ' → ' + q.answer[r.id] + '</b> ' + esc(ch.t);
   }).join(' · ') + ' <i>(' + hit + '/' + rows + ' correct)</i>';
  }
  return { got: got, detail: detail };
 }

 function gradeEssay(q) {
  var txt = (ans[q.id] || '').toLowerCase(), w = words(ans[q.id]);
  var hits = [], miss = [];
  q.keys.forEach(function (group) {
   var found = group.some(function (k) { return txt.indexOf(k.toLowerCase()) >= 0; });
   (found ? hits : miss).push(group[0]);
  });
  var ratio = hits.length / q.keys.length;
  // عقوبة خفيفة لو الإجابة قصيرة جداً
  var lenFactor = w >= MIN_WORDS ? 1 : Math.max(.55, w / MIN_WORDS);
  var got = w < 5 ? 0 : Math.round(q.marks * ratio * lenFactor * 100) / 100;
  return { got: got, hits: hits, miss: miss, w: w };
 }

 function finish(reason) {
  if (done) return;
  done = true;
  clearInterval(tick);
  try { localStorage.removeItem('comp_exam_state'); } catch (e) {}

  var objGot = 0, essGot = 0, rows = '';
  var n = 0, detailHtml = '';

  OBJ.forEach(function (q) {
   n++;
   var g = gradeObj(q);
   objGot += g.got;
   rows += '<tr><td>' + n + '</td><td>' + q.type.toUpperCase() + '</td><td><span class="tag t-' + q.level + '">' + q.level + '</span></td>' +
    '<td class="r" style="color:' + (g.got === q.marks ? 'var(--green)' : g.got > 0 ? 'var(--amber)' : 'var(--red)') + '">' +
    g.got + ' / ' + q.marks + '</td></tr>';
   var card = $('#q' + q.id);
   card.insertAdjacentHTML('beforeend',
    '<div class="model"><div class="mt">' + (g.got === q.marks ? '✔ Correct, ' + g.got + '/' + q.marks : '✖ ' + g.got + '/' + q.marks) + '</div>' +
    g.detail + '<div style="margin-top:8px;color:var(--muted)">' + esc(q.expl || '') + '</div></div>');
  });

  ESS.forEach(function (q) {
   n++;
   var g = gradeEssay(q);
   essGot += g.got;
   rows += '<tr><td>' + n + '</td><td>ESSAY</td><td><span class="tag t-' + q.level + '">' + q.level + '</span></td>' +
    '<td class="r" style="color:' + (g.got >= q.marks * .7 ? 'var(--green)' : g.got > 0 ? 'var(--amber)' : 'var(--red)') + '">' +
    g.got + ' / ' + q.marks + '</td></tr>';
   var ta = document.querySelector('textarea[data-q="' + q.id + '"]');
   if (ta) ta.readOnly = true;
   var kws = g.hits.map(function (k) { return '<span class="kw hit">✔ ' + esc(k) + '</span>'; }).join('') +
    g.miss.map(function (k) { return '<span class="kw miss">✖ ' + esc(k) + '</span>'; }).join('');
   $('#q' + q.id).insertAdjacentHTML('beforeend',
    '<div class="model"><div class="mt">Score ' + g.got + ' / ' + q.marks + ' · ' + g.hits.length + '/' + q.keys.length + ' key points · ' + g.w + ' words</div>' +
    '<div style="margin-bottom:10px">' + kws + '</div>' +
    '<div class="mt">Model answer</div>' + esc(q.answer) + '</div>');
  });

  var got = Math.round((objGot + essGot) * 100) / 100;
  var pct = Math.round((got / TOTAL) * 1000) / 10;
  var passed = pct >= PASS;
  var used = DURATION - Math.max(0, left);

  var C = 2 * Math.PI * 82;
  var off = C * (1 - Math.min(pct, 100) / 100);
  var col = passed ? 'var(--green)' : 'var(--red)';
  var nm = '';
  try { nm = sessionStorage.getItem('comp_exam_name') || ''; } catch (e) {}

  var head =
   '<div class="card" id="res">' +
   (nm ? '<p style="text-align:center;color:var(--muted);font-size:14px">' + esc(nm) + '</p>' : '') +
   '<div class="ring"><svg width="190" height="190">' +
   '<circle cx="95" cy="95" r="82" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="13"/>' +
   '<circle cx="95" cy="95" r="82" fill="none" stroke="' + col + '" stroke-width="13" stroke-linecap="round" ' +
   'stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '"/></svg>' +
   '<div class="val"><b style="color:' + col + '">' + pct + '%</b><span>' + got + ' / ' + TOTAL + '</span></div></div>' +
   '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + (passed ? '✔ PASSED' : '✖ FAILED') + '</div>' +
   '<p style="text-align:center;color:var(--muted);font-size:14px" class="ar">' +
   (passed ? 'مبروك, عدّيت درجة النجاح (٧٠٪).' : 'للأسف أقل من درجة النجاح (٧٠٪). راجع الإجابات النموذجية تحت وحاول تاني.') +
   (reason === 'timeout' ? ' <b style="color:var(--amber)">انتهى الوقت وتم التسليم أوتوماتيك.</b>' : '') + '</p>' +
   '<div class="grid3">' +
   '<div class="tot"><b style="color:var(--blue-2)">' + Math.round(objGot * 100) / 100 + ' / ' + TOT_OBJ + '</b><span>Section I, Objective</span></div>' +
   '<div class="tot"><b style="color:var(--violet-2)">' + Math.round(essGot * 100) / 100 + ' / ' + TOT_ESS + '</b><span>Section II, Essay</span></div>' +
   '<div class="tot"><b>' + fmt(used) + '</b><span>Time used</span></div>' +
   '</div>' +
   '<table><thead><tr><th>#</th><th>Type</th><th>Level</th><th class="r">Score</th></tr></thead><tbody>' + rows +
   '<tr><td colspan="3"><b>TOTAL</b></td><td class="r"><b style="color:' + col + '">' + got + ' / ' + TOTAL + '</b></td></tr>' +
   '</tbody></table>' +
   '<div style="text-align:center;margin-top:18px">' +
   '<button class="btn" onclick="location.reload()">إعادة الامتحان · Retake</button> ' +
   '<button class="btn ghost" onclick="window.print()">طباعة النتيجة</button></div>' +
   '</div>';

  var nav = $('#nav'); if (nav) nav.remove();
  var sub = $('#submit'); if (sub) sub.closest('.card').remove();
  $('.wrap').insertAdjacentHTML('afterbegin', head);
  $('#timer').textContent = 'DONE';
  $('#timer').className = '';
  $('#barf').style.width = '0%';
  $('#res').scrollIntoView({ behavior: 'smooth' });
 }

 /* ---------------- boot ---------------- */
 document.addEventListener('DOMContentLoaded', function () {
  var b = $('.brand');
  if (b) b.innerHTML = '<b>' + esc(CFG.name || 'Final Exam') + '</b><span>Comprehensive Exam, Chapters 1 and 2</span>';
  var lg = $('#hdrlogo');
  if (lg && CFG.logo) lg.src = CFG.logo; else if (lg) lg.remove();
  startScreen();
  window.addEventListener('beforeunload', function (e) {
   if (!done && started) { e.preventDefault(); e.returnValue = ''; }
  });
 });
})();

</script>
</body>
</html>
